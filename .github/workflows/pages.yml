name: Deploy live preview to GitHub Pages

# Manual trigger only — run this after Pages is enabled with Source = "GitHub Actions".
# (The Actions token can't auto-create the Pages site, so enablement is a one-time owner action.)
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage static site
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp -r assets public/assets
      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
