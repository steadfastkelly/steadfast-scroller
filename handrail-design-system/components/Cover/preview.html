<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Handrail</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--paper); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .panelf { fill:var(--panel); rx:var(--radius-lg); }
  .railf { fill:var(--rail); rx:var(--radius-md); }
  .apprf { fill:var(--approved); rx:var(--radius-md); }
  .tilef { fill:var(--surface); rx:var(--radius-md); }
  .sunkf { fill:var(--sunken); rx:var(--radius-md); }
  .pillf { fill:var(--on-panel); }
  .words { position:absolute; left:36px; right:36px; bottom:36px; max-width:440px; }
  .name { margin:0; font-size:80px; line-height:.92; font-weight:600; letter-spacing:-.05em; color:var(--ink); }
  .tag { margin:12px 0 0 4px; font-size:14px; line-height:20px; letter-spacing:-.02em; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      panel 228x188 (two tiles merged, the brand's dark block) · rail 112x92 (the one hue) · approved 112x92 (the status people trust) · sunken 228x92 · surface tiles for the rest · about 40% of 960x288
  arrangement a flush modular bento grid, 112x92 cells at tile-gap, bleeding off the right and bottom edges
  pattern     "geometric, modular, dense UI": tiles cut by radius-md, some merged two-wide, as the page shell is; two on-panel pills inside the panel echo the tag pills
  scales      gap tile-gap (4px); cells from space multiples; corners radius-lg on the panel, radius-md on tiles, radius-pill on pills
-->
<rect class="panelf" x="0" y="8" width="228" height="188" rx="24"/>
<rect class="railf" x="232" y="8" width="112" height="92" rx="14"/>
<rect class="tilef" x="348" y="8" width="140" height="92" rx="14"/>
<rect class="tilef" x="232" y="104" width="112" height="92" rx="14"/>
<rect class="tilef" x="348" y="104" width="140" height="188" rx="14"/>
<rect class="sunkf" x="0" y="200" width="228" height="92" rx="14"/>
<rect class="apprf" x="232" y="200" width="112" height="92" rx="14"/>
<rect class="pillf" x="20" y="152" width="72" height="24" rx="12"/>
<rect class="pillf" x="96" y="152" width="96" height="24" rx="12"/>
</svg>
</div>
<div class="words">
<h1 class="name">Handrail.</h1>
<p class="tag">The operations handbook people actually open.</p>
</div>
</div>
</body>
</html>
